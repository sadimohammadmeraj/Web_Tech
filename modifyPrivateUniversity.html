
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modify Private Universities</title>

    <link rel="stylesheet" href="modifyPrivateUniversity.css">
</head>

<body>

    <div class="container">

        <!-- Page Header -->
        <header class="page-header">

            <div>
                <h1>Modify Private Universities</h1>
                <p>Search, edit or remove private university information.</p>
            </div>

            <a href="modifyUniversity.html" class="back-button">
                Back
            </a>

        </header>


        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="searchUniversity"
                placeholder="Search university by name..."
            >

        </section>


        <!-- University List -->
        <section class="university-section">

            <h2>Private University List</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>University Name</th>
                            <th>Edit Info</th>
                            <th>Remove University</th>
                        </tr>
                    </thead>

                    <tbody id="universityTable">

                        <!-- University records will be displayed here using JavaScript -->

                    </tbody>

                </table>

                <p id="noUniversity" class="no-university" hidden>
                    No university found.
                </p>

            </div>

        </section>

    </div>


    <script src="modifyPrivateUniversity.js"></script>

</body>
</html>
